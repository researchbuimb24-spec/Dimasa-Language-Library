[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dimasa"
version = "0.1.0"
description = "A comprehensive Python library for the computational processing, documentation, and digital preservation of the Dimasa language."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Dimasa Digital Preservation Initiative", email = "info@dimasa-preservation.org" }
]
maintainers = [
    { name = "Dimasa Digital Preservation Initiative", email = "info@dimasa-preservation.org" }
]
keywords = [
    "dimasa",
    "grao-dima",
    "computational-linguistics",
    "nlp",
    "tibeto-burman",
    "bodo-garo",
    "language-preservation",
    "endangered-languages",
    "assam",
    "dima-hasao",
    "northeast-india"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
dimasa = "dimasa.cli.main:main"

[project.urls]
Homepage = "https://github.com/dimasa-preservation/dimasa"
Documentation = "https://github.com/dimasa-preservation/dimasa/tree/main/docs"
Repository = "https://github.com/dimasa-preservation/dimasa.git"
"Bug Tracker" = "https://github.com/dimasa-preservation/dimasa/issues"
"Linguistic Archive" = "https://bododimasaarchive.org"

[tool.setuptools.packages.find]
where = ["."]
include = ["dimasa*"]

[tool.setuptools.package-data]
dimasa = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

